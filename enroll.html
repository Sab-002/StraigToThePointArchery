<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll - Straight to the Point Archery</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .fade-up,
        .fade-left {
            opacity: 0;
            transition: all 0.9s ease;
        }

        .fade-up {
            transform: translateY(40px);
        }

        .fade-left {
            transform: translateX(-40px);
        }

        .show-animate {
            opacity: 1;
            transform: translate(0,0);
        }
    </style>
</head>
<body>
    
    <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">Straight to the Point Archery</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#services">Services</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#classes">Classes</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="btn btn-warning ms-lg-3" href="enroll.html">Enroll Now</a></li>
                    </ul>
                </div>
            </div>
    </nav>
<!-- HERO -->
<section class="py-5 bg-dark text-white text-center">
    <div class="container">
        <h1 class="display-4 fw-bold fade-up">Enroll Now</h1>
        <p class="lead mt-3 fade-up">
            Start your archery journey by joining one of our available classes.
        </p>
    </div>
</section>

<!-- FORM -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 fade-up">

                <div class="card shadow border-0">
                    <div class="card-body p-5">

                        <form>

                            <div class="mb-3 fade-left">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" required>
                            </div>

                            <div class="mb-3 fade-left">
                                <label class="form-label">Age</label>
                                <input type="number" class="form-control" required>
                            </div>

                            <div class="mb-3 fade-left">
                                <label class="form-label">Select Class</label>
                                <select class="form-control" required>
                                    <option value="">Choose a class</option>
                                    <option>ARCH101 - Intro to Archery</option>
                                    <option>ARCH201 - Intermediate Form</option>
                                    <option>ARCH301 - Elite Competition</option>
                                </select>
                            </div>

                            <div class="mb-3 fade-left">
                                <label class="form-label">Preferred Schedule</label>
                                <input type="text" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-warning px-4">
                                Submit Enrollment
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const animatedItems = document.querySelectorAll(".fade-up, .fade-left");

    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting) {
                entry.target.classList.add("show-animate");
            }
        });
    }, { threshold: 0.15 });

    animatedItems.forEach((item) => observer.observe(item));
});
</script>

</body>
</html>
